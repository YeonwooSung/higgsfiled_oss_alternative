# Product Lock: web + API + CPU worker + Postgres (+ optional MinIO). GPU inference runs on Comfy.
# Usage: cp .env.example .env && docker compose -f infra/docker-compose.yml --env-file .env up --build
name: open-creative

x-python: &python
  build: { context: .., dockerfile: infra/Dockerfile.python }
  env_file: ../.env
  environment:
    OC_DATABASE_URL: postgresql+psycopg://oc:oc@postgres:5432/oc
    OC_STORAGE_DIR: /data/storage
    OC_WORK_DIR: /data/work
  volumes: [ "oc-data:/data" ]
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: oc, POSTGRES_PASSWORD: oc, POSTGRES_DB: oc }
    volumes: [ "pg-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "oc"], interval: 2s, retries: 30 }

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile.python }
    environment: { OC_DATABASE_URL: "postgresql+psycopg://oc:oc@postgres:5432/oc" }
    working_dir: /app/services/api
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *python
    ports: [ "8000:8000" ]

  worker:
    <<: *python
    command: ["python", "-m", "oc_worker.main", "--concurrency", "2"]

  web:
    build: { context: .., dockerfile: infra/Dockerfile.web, args: { API_ORIGIN: "http://api:8000" } }
    ports: [ "3000:3000" ]
    depends_on: [ api ]

  # S3-compatible storage. Enable with `--profile s3` and OC_STORAGE_BACKEND=s3; the browser must be able to
  # reach OC_S3_ENDPOINT_URL, and the bucket needs CORS for GET/PUT from the web origin.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [ "s3" ]
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-minio}", MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minio-secret}" }
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "minio-data:/data" ]

volumes:
  pg-data: {}
  oc-data: {}
  minio-data: {}
