# Studio (:3000: Camera Sketch, Product Lock, Pocket VFX) + API + CPU worker + Postgres (+ optional MinIO). GPU inference runs on Comfy.
# Usage: cp .env.example .env && docker compose -f infra/docker-compose.yml --env-file .env up --build
name: open-creative

x-python: &python
  build: { context: .., dockerfile: infra/Dockerfile.python }
  env_file: ../.env
  environment:
    OC_DATABASE_URL: postgresql+psycopg://oc:oc@postgres:5432/oc
    OC_STORAGE_DIR: /data/storage
    OC_WORK_DIR: /data/work
  volumes: [ "oc-data:/data" ]
  depends_on:
    migrate: { condition: service_completed_successfully }
    # Only with `--profile s3`: the bucket exists before the API hands out upload URLs.
    minio-init: { condition: service_completed_successfully, required: false }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: oc, POSTGRES_PASSWORD: oc, POSTGRES_DB: oc }
    volumes: [ "pg-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "oc"], interval: 2s, retries: 30 }

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile.python }
    environment: { OC_DATABASE_URL: "postgresql+psycopg://oc:oc@postgres:5432/oc" }
    working_dir: /app/services/api
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *python
    ports: [ "8000:8000" ]

  worker:
    <<: *python
    command: ["python", "-m", "oc_worker.main", "--concurrency", "2"]

  web:
    build: { context: .., dockerfile: infra/Dockerfile.web, args: { API_ORIGIN: "http://api:8000", APP: studio, PORT: "3000" } }
    ports: [ "3000:3000" ]
    depends_on: [ api ]

  # S3-compatible storage. Enable with `--profile s3` and, in .env, OC_STORAGE_BACKEND=s3,
  # OC_S3_ENDPOINT_URL=http://minio:9000 (API/worker) and OC_S3_PUBLIC_ENDPOINT_URL=http://localhost:9000 (the
  # presigned URLs the browser opens). MinIO has no per-bucket CORS (PutBucketCors is not implemented); its
  # server-wide allow-list below lets the web origin PUT uploads and GET with Range cross-origin.
  # Upstream minio/minio images are no longer published on Docker Hub; pgsty/minio is a maintained MinIO build.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: [ "s3" ]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-minio}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minio-secret}"
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "minio-data:/data" ]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"], interval: 2s, retries: 30 }

  # Creates the bucket once MinIO is up (idempotent).
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: [ "s3" ]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$BUCKET"
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-minio}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-minio-secret}"
      BUCKET: "${OC_S3_BUCKET:-open-creative}"
    depends_on: { minio: { condition: service_healthy } }

volumes:
  pg-data: {}
  oc-data: {}
  minio-data: {}
