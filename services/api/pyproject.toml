[project]
name = "oc-api"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "open-creative",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
]

[tool.uv.sources]
open-creative = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oc_api"]
