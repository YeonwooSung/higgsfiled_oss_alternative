[project]
name = "oc-worker"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["open-creative", "oc-api", "comfy-sdk==0.5.0"]

[tool.uv.sources]
open-creative = { workspace = true }
oc-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oc_worker"]
