[project]
name = "open-creative-apps"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["open-creative", "oc-api", "oc-worker"]

[tool.uv.workspace]
members = ["nodes/open_creative", "services/api", "services/worker"]

[tool.uv.sources]
open-creative = { workspace = true }
oc-api = { workspace = true }
oc-worker = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["nodes/open_creative/tests", "services/api/tests", "services/worker/tests"]
addopts = "--import-mode=importlib -m 'not slow'"
markers = ["slow: full-length render acceptance tests (run with -m slow)"]
